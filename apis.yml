x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated machine-readable contracts were found, verified live, and are
    documented here with OpenAPI, JSON Schema, authentication, scopes, errors, vocabulary,
    lifecycle and rules artifacts: Qatar University's own OpenID Connect / SAML 2.0 identity
    provider at sso.qu.edu.qa, and Qatar University Press's self-hosted Open Journal Systems
    OAI-PMH endpoint at journals.qu.edu.qa. Both resolve into QUNET, Qatar University's own RIPE
    allocation, with no CNAME onto a managed platform, on Qatar University certificates. Neither
    appeared in the June 2026 profile.

    The headline result is a correction that LOWERS the apparent footprint. The June 2026 pass
    recorded QSpace (qspace.qu.edu.qa) as Qatar University's own API on hostname evidence. DNS
    says otherwise: it CNAMEs to qataru.cname.openrepository.com and terminates on Amazon
    eu-west-1, behind Open Repository's commercial hosted-DSpace service, on a Let's Encrypt
    certificate rather than the Qatar University DigiCert wildcard its self-hosted services
    carry, with atmire-* modules exposed in the API root. Two OpenAPI documents and ten example
    captures written for QSpace during this run were removed within the same run; the QSpace
    relationship itself is retained as an apis[] entry with x-operator: tenant, because the
    repository, its 66,950 records, its Handle prefix 10576 and its administration are genuine
    institutional facts. Learning (Blackboard Learn) and library guides (Springshare LibGuides)
    are tenancies on the same pattern. Three registry memberships — ROR 00yhnba62, Crossref
    member 11655 with DOI prefix 10.29117, and Handle.Net prefix 10576 — are recorded as
    memberships, never as contracts. DataCite was specifically checked and Qatar University has
    no record; the only Qatari DataCite provider is Qatar National Library, a different
    institution.

    What is genuinely absent, after probing: no developer portal (developer.qu.edu.qa does not
    resolve), no open data portal (data.qu.edu.qa and opendata.qu.edu.qa do not resolve), no
    published OpenAPI for anything, no changelog, no status page, no API terms of service, no
    llms.txt, and no real security.txt on either the main site or the repository. No Qatari
    national research-and-education identity federation was found and the SAML entity is not in
    eduGAIN. No AI policy or AI-tooling statement was located on the university or library
    surfaces searched. Public Ellucian Banner course-catalog and class-schedule modules return
    HTTP 500.

    The most consequential gap is an API programme with no front door: api.qu.edu.qa resolves to
    34.18.7.7 and answers HTTP 404 with a zero-length body and an F5 BIG-IP
    `BIGipServerPROD-API-POOL` cookie, proving a production API pool runs behind it. Nothing
    about it is public.

    Two probe limitations, ours not Qatar University's, both worked around and both recorded as
    findings in their own right: sso.qu.edu.qa and journals.qu.edu.qa serve an incomplete TLS
    chain, so every capture from them was taken with certificate verification disabled, and
    crt.sh was returning 502 during this run so subdomain enumeration was done by DNS probing a
    curated candidate list rather than by certificate transparency. Arabic-language surfaces were
    checked — www.qu.edu.qa serves Arabic by default and the OJS platform carries Arabic journal
    sections — and no additional programmable surface was found on them.
