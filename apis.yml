    CN=*.qu.edu.qa, and the embedded SAML signing certificate is self-issued by C=QA, ST=Qatar,
    L=Doha, O=Qatar University, OU=ITS. WSO2 wrote the software; Qatar University runs the
    deployment, holds the keys and owns the identity data.
- aid: qatar:qu-sso-saml
  name: Qatar University SAML 2.0 Identity Provider
  description: >-
    The same host publishes a SAML 2.0 IDPSSODescriptor at /identity/metadata/saml2, entityID
    `sso.qu.edu.qa`, with separate signing and encryption key descriptors, HTTP-POST and
    HTTP-Redirect single sign-on bindings, and a SOAP artifact-resolution service. A university
    running its own SAML IdP on its own address space is a stronger result than most of this
    cohort, where a branded IdP hostname resolves onto a national federation's managed service.
    Three publication defects keep it from being federatable as it stands: the entityID is a
    bare hostname rather than a URI, validUntil is regenerated one hour ahead of every fetch, and
    no NameIDFormat, Organization or ContactPerson element is declared. No Qatari national
    research-and-education federation was found and the entity is not in eduGAIN.
  humanURL: https://sso.qu.edu.qa/identity/metadata/saml2
  baseURL: https://sso.qu.edu.qa/samlsso
