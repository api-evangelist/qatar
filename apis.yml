- aid: qatar:qspace
  name: QSpace Institutional Repository (Open Repository tenant)
  description: >-
    QSpace is Qatar University's institutional repository — 66,950 records, DSpace 7.6,
    administered by Qatar University Library at quspace@qu.edu.qa, with every item carrying a
    persistent identifier under Qatar University's Handle prefix 10576. It serves an anonymous
    OAI-PMH 2.0 endpoint with twelve dissemination formats, a public DSpace REST/HAL read API,
    and an OpenSearch 1.1 description document. All of that is real, and none of it is Qatar
    University's engineering: qspace.qu.edu.qa CNAMEs to qataru.cname.openrepository.com and
    resolves to Amazon eu-west-1, on a Let's Encrypt certificate rather than the Qatar University
    DigiCert certificate its self-hosted services carry, and the API root advertises atmire-*
    HAL links. Open Repository self-describes as "premium DSpace hosting". Recorded as a tenant
    relationship — the repository is a genuine institutional fact and one of Qatar University's
    few programmable surfaces — with the contract deliberately NOT saved here. Its Identify
    response also leaks an unexpanded DSpace configuration placeholder as its repositoryIdentifier.
  humanURL: https://qspace.qu.edu.qa/
  baseURL: https://qspace.qu.edu.qa/server
