- aid: qatar:qupress-oai
  name: QU Press Open Journal System OAI-PMH API
  description: >-
    Qatar University Press self-hosts Open Journal Systems 3.3.0.7 at journals.qu.edu.qa and
    exposes an anonymous OAI-PMH 2.0 endpoint, site-wide and per journal. It identifies as
    "QU Press Open Journal System", adminEmail mjaberi@qu.edu.qa, earliest datestamp 2017-12-26,
    deletedRecord persistent, with gzip and deflate compression declared, four dissemination
    formats, 100 sets across eight journals in Arabic and English, and completeListSize 3,186.
