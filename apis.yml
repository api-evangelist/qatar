aid: qatar
name: Qatar University
description: >-
  Qatar University is the national public research university of the State of Qatar, in Doha,
  founded 1973 and registered as https://ror.org/00yhnba62. Its institution-operated
  programmable footprint is small, real, and not where the June 2026 profile said it was. That
  pass recorded QSpace — the institutional repository at qspace.qu.edu.qa — as Qatar
  University's own API. It is not: qspace.qu.edu.qa CNAMEs to qataru.cname.openrepository.com
  and terminates on Amazon eu-west-1, making it a tenant of Open Repository, a commercial
  hosted-DSpace service. The 66,950 records, the Handle prefix 10576 and the administrative
  contact are Qatar University's; the DSpace REST and OAI-PMH contracts are the hosting
  platform's engineering, and they are recorded here as a tenancy rather than saved as Qatar
  University's contracts. What the earlier pass missed is the part Qatar University actually
  runs. It operates its own identity provider at sso.qu.edu.qa — a WSO2 Identity Server on
  QUNET, its own RIPE allocation — publishing both a SAML 2.0 IdP metadata document and a
  complete OpenID Connect discovery document, which together are the strongest machine-readable
  contract in this profile. Qatar University Press self-hosts Open Journal Systems 3.3.0.7 at
  journals.qu.edu.qa, also on QUNET, serving an anonymous OAI-PMH 2.0 endpoint over eight
  journals and 3,186 records in Arabic and English, and registers DOIs as Crossref member 11655
  under prefix 10.29117. Learning is a Blackboard Learn tenant and library guides are a
  Springshare tenant. There is no developer portal, no changelog, no status page, no API terms
  of service, and no published OpenAPI for anything — and there is an institutional API gateway
  at api.qu.edu.qa that fronts a live production API pool while publishing no route,
  documentation or access path whatsoever. Three verified defects sit on the surfaces Qatar
  University does run: sso.qu.edu.qa and journals.qu.edu.qa both serve an incomplete TLS chain
  that a default client cannot verify, the SAML entityID is a bare hostname rather than a URI
  so the IdP cannot be federated as published, and the OAI-PMH endpoint emits record
  identifiers that its own GetRecord verb rejects.
