apis:
- aid: qatar:qu-sso-oidc
  name: Qatar University Single Sign-On (OpenID Connect / OAuth 2.0)
  description: >-
    Qatar University's own OpenID Connect provider, running on a WSO2 Identity Server at
    sso.qu.edu.qa. It publishes a complete OpenID Connect Discovery 1.0 document, a live JWKS
    serving an RS256 signing key, and authorization, token, userinfo, introspection, revocation,
    logout, session-check and dynamic-client-registration endpoints. Five scopes are supported —
    the five OIDC standards, with nothing institution-specific — and thirty claims, including
    the non-standard `groups` and `upn`. Client registration is institutional; there is no public
    self-service onboarding. This is the most complete machine-readable contract in the profile
    and it was entirely absent from the June 2026 pass. It is also, as published, unreadable to a
    conformant client: the host serves an incomplete TLS chain, the issuer names the WSO2
    management port, and the discovery document sits at a non-RFC-8414 location.
  humanURL: https://sso.qu.edu.qa/
  baseURL: https://sso.qu.edu.qa
  tags: [ Identity Federation, OpenID Connect, OAuth 2.0, Single Sign-On, Authentication ]
